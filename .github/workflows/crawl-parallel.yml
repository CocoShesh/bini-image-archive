name: BINI Archive · 5-Way Parallel Crawler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

concurrency:
  group: bini-archive-crawler
  cancel-in-progress: false

env:
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
  R2_STATE_PREFIX: state
  CRAWL_WORKER_COUNT: 5
  MAX_SCROLLS: 120
  SCROLL_DELAY: 2200
  STABLE_ROUNDS: 8
  IMAGE_QUALITY: 90
  KEEP_LOCAL: false
  QUERY_DELAY: 0
  MAX_RUN_MINUTES: 300
jobs:
  prepare:
    name: Read R2 checkpoint
    runs-on: ubuntu-latest
    outputs:
      base_index: ${{ steps.checkpoint.outputs.base_index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: checkpoint
        run: node scripts/prepare-parallel-crawl.mjs

  crawl:
    name: Worker ${{ matrix.worker }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        worker: [0, 1, 2, 3, 4]
    env:
      CRAWL_WORKER_ID: ${{ matrix.worker }}
      CRAWL_BASE_INDEX: ${{ needs.prepare.outputs.base_index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/crawl-parallel-worker.mjs

  merge:
    name: Merge workers
    runs-on: ubuntu-latest
    needs: [prepare, crawl]
    if: ${{ always() && needs.prepare.result == 'success' }}
    env:
      CRAWL_WORKER_COUNT: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/merge-parallel-crawl.mjs
